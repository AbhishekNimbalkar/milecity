<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milecity Land Allotment Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#EEF2F7;color:#0A1929;min-height:100vh}
:root{--navy:#0D1F3C;--blue:#1B4FCC;--teal:#0B7B6B;--amber:#A05C00;--green:#135B35;--red:#A8133B;--purple:#5B21B6;--border:#E1E8F0;--card:#fff;--bg:#EEF2F7;--sub:#4A5568;--muted:#9AA5B1}
input,select,textarea{border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:12px;color:#0A1929;background:#fff;outline:none;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #EBF2FF}
textarea{resize:vertical;min-height:72px}
button{cursor:pointer;font-family:inherit;font-size:12px}
.btn-primary{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 16px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost{background:#fff;color:#4A5568;border:1px solid var(--border);border-radius:8px;padding:8px 16px}
.btn-success{background:#ECFDF5;color:#065F46;border:1px solid #6EE7B7;border-radius:8px;padding:8px 16px;display:inline-flex;align-items:center;gap:6px}
.btn-danger{background:#DC2626;color:#fff;border:none;border-radius:8px;padding:8px 16px}
button:disabled{opacity:.4;cursor:not-allowed}
.label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px;letter-spacing:.02em}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px}
.info-box{background:#EBF2FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 14px;font-size:12px;color:#1E40AF;line-height:1.6;margin-bottom:12px}
.success-box{background:#ECFDF5;border:1px solid #6EE7B7;border-radius:8px;padding:10px 14px;font-size:12px;color:#065F46;line-height:1.6;margin-bottom:12px}
.warning-box{background:#FFFBEB;border:1px solid #FCD34D;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400E;line-height:1.6;margin-bottom:12px}
.divider{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}

/* LANDING */
.landing{max-width:960px;margin:0 auto;padding:40px 20px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center;flex-direction:column;text-align:center}
.brand-icon{width:52px;height:52px;border-radius:14px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px}
.brand-title{font-size:24px;font-weight:700;color:var(--navy)}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.role-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;transition:all .2s}
.role-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
.role-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.role-name{font-size:15px;font-weight:700;margin-bottom:3px}
.role-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.role-cap{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--sub);margin-bottom:6px}
.role-btn{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:#F8FAFC;font-weight:600;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.role-btn:hover{background:#F1F5F9}
.reg-link{text-align:center;font-size:12px;color:var(--muted)}
.reg-link button{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;text-decoration:underline}

/* WIZARD */
.wizard{max-width:640px;margin:0 auto;padding:32px 20px}
.step-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:20px}
.step-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:90px}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.step-dot.done{background:#D1FAE5;color:#065F46}
.step-dot.active{background:var(--navy);color:#fff}
.step-dot.todo{background:#F1F5F9;color:var(--muted)}
.step-label{font-size:9px;text-align:center;line-height:1.3;color:var(--sub)}
.step-line{flex:1;height:1.5px;background:var(--border);margin:0 6px;margin-bottom:20px}
.step-line.done{background:#6EE7B7}
.wiz-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.wiz-card h2{font-size:18px;font-weight:700;margin-bottom:5px}
.wiz-card p{font-size:13px;color:var(--sub);margin-bottom:22px;line-height:1.6}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.step-hint{font-size:11px;color:var(--muted)}
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;transition:all .15s}
.doc-row.uploaded{border-color:#6EE7B7;background:#F0FDF4}
.doc-icon{width:32px;height:32px;border-radius:7px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:15px}
.doc-icon.up{background:#D1FAE5}
.doc-name{font-size:12px;font-weight:600}
.doc-req{font-size:10px;color:var(--red)}
.doc-opt{font-size:10px;color:var(--muted)}

/* PORTAL */
.portal{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:6px}
.sb-title{font-size:13px;font-weight:700;color:#F0F8FF}
.sb-subtitle{font-size:9px;color:#4A6080;letter-spacing:.05em}
.sb-user{margin:10px 12px 0;background:rgba(255,255,255,.07);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.sb-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:11px;font-weight:600;color:#E0EEFF}
.sb-urole{font-size:9px;color:#6A90B0}
.sb-nav{padding:14px 10px;flex:1}
.sb-nav-label{font-size:8px;font-weight:700;color:#2A4060;letter-spacing:.08em;padding:0 7px;margin-bottom:5px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;margin-bottom:2px;cursor:pointer;color:#6A90B0;font-size:12px;transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,.06);color:#C0D8F0}
.sb-item.active{background:rgba(255,255,255,.12);color:#E0EEFF;font-weight:600}
.sb-item-icon{font-size:16px;flex-shrink:0}
.sb-badge{margin-left:auto;background:#EF4444;color:#fff;font-size:8px;font-weight:700;border-radius:10px;padding:2px 5px}
.sb-footer{padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.06)}
.sb-switch{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#4A6080;font-size:12px}
.sb-switch:hover{background:rgba(255,255,255,.05);color:#6A90B0}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.tb-title p:first-child{font-size:13px;font-weight:700}
.tb-title p:last-child{font-size:10px;color:var(--muted)}
.tb-search{display:flex;align-items:center;gap:8px;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:6px 12px;width:200px}
.tb-search input{border:none;background:none;font-size:12px;width:100%}
.notif{position:relative;cursor:pointer;font-size:18px}
.notif-dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#EF4444;border-radius:50%;font-size:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.role-pill{border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--sub)}
.content-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.content{flex:1;overflow-y:auto;padding:22px}
.panel-open .content{padding-right:20px}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.stat-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-val{font-size:22px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--sub);margin-top:3px}
.stat-sub{font-size:10px;font-weight:600;margin-top:2px}

/* APP CARDS */
.section-title{font-size:12px;font-weight:700;color:#0A1929;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.app-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;margin-bottom:8px;transition:all .12s}
.app-card:hover{border-color:#CBD5E1;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.app-card.selected{border-color:var(--blue);box-shadow:0 0 0 3px #EBF2FF}
.app-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.app-id{font-size:10px;color:var(--muted);font-family:monospace}
.app-name{font-size:13px;font-weight:700;margin-bottom:3px}
.app-prod{font-size:11px;color:var(--sub);margin-bottom:8px}
.app-footer{display:flex;justify-content:space-between;align-items:center}
.app-date{font-size:10px;color:var(--muted)}
.prog-bar{display:flex;gap:2px;margin-top:8px}
.prog-seg{flex:1;height:2.5px;border-radius:2px}
.open-q-badge{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;font-weight:600;background:#FFFBEB;color:#92400E;padding:2px 8px;border-radius:4px}
.empty-state{text-align:center;padding:32px;background:#F8FAFC;border-radius:10px;color:var(--muted);font-size:13px}

/* STATUS + PRIORITY BADGES */
.s-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.p-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}

/* SLIDE PANEL */
.slide-panel{position:absolute;top:0;right:0;width:440px;height:100%;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:20;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.panel-hdr{padding:14px 18px;border-bottom:1px solid var(--border);background:#F8FAFC}
.panel-id{font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:2px}
.panel-name{font-size:14px;font-weight:700;line-height:1.3}
.panel-sub{font-size:11px;color:var(--sub);margin-top:2px}
.panel-close{background:none;border:none;color:var(--muted);font-size:20px;padding:2px;line-height:1}
.panel-status{padding:10px 18px;border-bottom:1px solid var(--border)}
.panel-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.prog-mini{display:flex;gap:1.5px}
.prog-mini-seg{flex:1;height:4px;border-radius:2px}
.panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.panel-tab{flex:1;padding:10px 0;font-size:11px;font-weight:400;color:var(--sub);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .1s}
.panel-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.panel-body{flex:1;overflow-y:auto;padding:16px 18px}
.panel-actions{padding:14px 18px;border-top:1px solid var(--border);background:#F8FAFC}
.actions-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.act-btn{width:100%;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:6px;transition:all .12s;border:1.5px solid}

/* INFO BLOCKS */
.info-block{border-radius:9px;padding:12px 14px;margin-bottom:12px;border:1px solid}
.info-block .ib-title{font-size:10px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.info-block .ib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ib-key{font-size:9px;font-weight:700;margin-bottom:1px}
.ib-val{font-size:11px;font-weight:600}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F8FAFC;font-size:12px}
.detail-key{color:var(--sub)}
.detail-val{font-weight:600;text-align:right}

/* EFFLUENT */
.ef-card{background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:11px;margin-bottom:9px}
.ef-top{display:flex;justify-content:space-between;margin-bottom:6px}
.ef-name{font-size:12px;font-weight:700}
.ef-full{font-size:10px;color:var(--muted);margin-left:6px}
.ef-val{font-size:14px;font-weight:800}
.ef-unit{font-size:10px;color:var(--muted);margin-left:3px}
.ef-bar-bg{height:5px;background:#E2E8F0;border-radius:3px}
.ef-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.ef-bottom{display:flex;justify-content:space-between;margin-top:3px;font-size:9px;color:var(--muted)}
.ef-level{font-weight:700}

/* QUERY CARDS */
.q-card{border:1px solid;border-radius:10px;padding:13px;margin-bottom:10px}
.q-from{font-size:11px;font-weight:700}
.q-time{font-size:10px;color:var(--muted)}
.q-text{font-size:12px;line-height:1.55;margin-top:5px}
.q-response{border-top:1px solid;padding-top:8px;margin-top:9px}
.q-resp-label{font-size:10px;font-weight:700;margin-bottom:3px}
.q-resp-text{font-size:12px}
.q-pending{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;margin-top:6px}
.reply-box{border:1px solid var(--border);border-radius:10px;padding:14px;background:#F8FAFC;margin-top:10px}
.reply-label{font-size:11px;font-weight:700;margin-bottom:8px}

/* TIMELINE */
.timeline{position:relative;padding-left:22px}
.tl-line{position:absolute;left:9px;top:0;bottom:0;width:1.5px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-16px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid}
.tl-step{font-size:12px;font-weight:600}
.tl-by{font-size:11px;color:var(--muted)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:460px;box-shadow:0 24px 48px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:3px}
.modal-sub{font-size:11px;color:var(--muted);margin-bottom:18px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* PROCESS FLOW */
.phase-flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:18px}
.phase-pill{background:#F8FAFC;border:1px solid var(--border);border-radius:9px;padding:11px 13px;flex-shrink:0;min-width:110px}
.phase-code{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;margin-bottom:7px}
.phase-pill-name{font-size:11px;font-weight:700;line-height:1.3}
.phase-note{font-size:9px;font-weight:700;color:#fff;padding:1px 6px;border-radius:3px;display:inline-block;margin-top:4px}
.phase-arrow{display:flex;align-items:center;padding:0 2px;color:var(--muted);font-size:18px;flex-shrink:0}
.phase-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phase-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.phase-card-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:4px solid}
.phase-card-code{width:28px;height:28px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.phase-card-name{font-size:12px;font-weight:700;flex:1}
.phase-card-note{font-size:9px;font-weight:700;color:#fff;padding:1px 6px;border-radius:3px}
.phase-card-body{padding:9px 14px 12px}
.phase-step{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--sub);margin-bottom:5px}
.phase-step-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
.emd-box{background:#F0FDF4;border:1.5px solid #6EE7B7;border-radius:12px;padding:16px 18px}
.emd-title{font-size:12px;font-weight:700;color:#065F46;margin-bottom:12px}
.emd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emd-card{background:#fff;border:1px solid #6EE7B7;border-radius:9px;padding:11px}
.emd-when{font-size:9px;font-weight:700;color:#065F46;margin-bottom:2px}
.emd-amt{font-size:15px;font-weight:800;color:#065F46;margin-bottom:2px}
.emd-desc{font-size:10px;color:var(--sub)}

/* PLOT SELECTOR */
.plot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.plot-tile{padding:9px 10px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;transition:all .12s}
.plot-tile:hover:not(.allotted){border-color:#94A3B8}
.plot-tile.available{background:#fff}
.plot-tile.allotted{background:#F8FAFC;cursor:not-allowed;opacity:.6}
.plot-tile.under-review{background:#FFFBEB}
.plot-tile.selected{border-color:var(--blue);background:#EBF2FF}
.plot-id{font-size:11px;font-weight:700;margin-bottom:2px}
.plot-area{font-size:10px;color:var(--muted)}
.plot-status{font-size:10px;font-weight:700;margin-top:4px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;color:var(--sub);cursor:pointer;transition:all .12s}
.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* NEW APP STEPS */
.new-app-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.new-app-tab{flex:1;padding:10px 0;font-size:12px;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.new-app-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.new-app-tab.done{color:#065F46}
.step-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0D1F3C;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;white-space:nowrap}

/* OTP inputs */
.otp-inputs{display:flex;gap:8px}
.otp-input{width:42px;text-align:center;font-size:20px;font-weight:700;padding:8px 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>

<script>

function fmtCr(v) { return v >= 10000000 ? '₹'+(v/10000000).toFixed(2)+' Cr' : '₹'+(v/100000).toFixed(1)+' L'; }
function stBadge(s) {

function priBadge(p) {

function progBar(status, accent) {
  var si = STAGE_MAP[status] || 0;
  return Array(13).fill(0).map(function(_,i) {
    return '<div class="prog-seg" style="background:'+(i<=si?accent:'#E2E8F0')+'"></div>';
  }).join('');
}

function showToast(msg) {
  var t = document.getElementById('toast-container');
  t.innerHTML = '<div class="toast">✓ '+msg+'</div>';
  setTimeout(function(){ t.innerHTML=''; }, 2400);
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function doAction(type, appId, extra) {
  var now = new Date().toLocaleString('en-IN',{day:'numeric',month:'short'});
  var name = ROLES[S.role] ? ROLES[S.role].name : 'System';
  var msg = '';
  S.apps = S.apps.map(function(a) {
    if (a.id !== appId) return a;
    var r = JSON.parse(JSON.stringify(a));
    function addH(s) { r.history = r.history.concat([{s:s,by:name,at:now}]); }
    if(type==='begin-l1'){r.status='L1 Review';addH('L1 Review initiated');}
    else if(type==='approve-l1'){msg='L1 approved';r.status='L1 Approved';addH('L1 Approved'+(extra?' — '+extra:''));}
    else if(type==='query-l1'){msg='Query raised to applicant';r.status='Query — Applicant';r.queries=r.queries.concat([{id:'q'+Date.now(),from:'Review Team L1',to:'Applicant',text:extra,raised:now,resolved:false}]);addH('Query raised to Applicant');}
    else if(type==='begin-l2'){r.status='L2 Review';addH('L2 Review started');}
    else if(type==='approve-l2'){msg='L2 approved';r.status='L2 Approved';addH('L2 Approved'+(extra?' — '+extra:''));}
    else if(type==='query-l2'){msg='Query raised to applicant';r.status='Query — Applicant';r.queries=r.queries.concat([{id:'q'+Date.now(),from:'Review Team L2',to:'Applicant',text:extra,raised:now,resolved:false}]);addH('Query raised to Applicant');}
    else if(type==='begin-md'){r.status='MD Review';addH('Sent for MD approval');}
    else if(type==='approve-md'){msg='MD approved — ready for authority';r.status='Review Approved';addH('MD Final Approval'+(extra?' — '+extra:''));}
    else if(type==='forward-auth'){msg='Forwarded to Milecity Authority';r.status='With Authority';addH('Forwarded to Milecity Authority');}
    else if(type==='begin-auth'){r.status='Authority Review';addH('Authority Review commenced');}
    else if(type==='auth-approve'){msg='Allotment Order issued!';r.status='Allotment Ordered';addH('Allotment Order issued'+(extra?' — '+extra:''));}
    else if(type==='auth-query'){msg='Query raised to Review Team';r.status='Authority Query';r.queries=r.queries.concat([{id:'q'+Date.now(),from:'Authority',to:'Review Team',text:extra,raised:now,resolved:false}]);addH('Authority query raised');}
    else if(type==='auth-reject'){msg='Application rejected';r.status='Rejected';addH('Rejected — '+extra);}
    else if(type==='auth-query-resolved'){msg='Query resolved — review resumed';r.status='Authority Review';r.queries=r.queries.map(function(q){return(q.from==='Authority'&&!q.resolved)?Object.assign({},q,{resolved:true,reply:'Response received from Review Team',replyDate:now}):q;});addH('Query response received');}
    else if(type==='reply'){msg='Response submitted';r.status=(a.status==='Query — Applicant'?'L1 Review':a.status);r.queries=r.queries.map(function(q){return q.id===extra.qid?Object.assign({},q,{resolved:true,reply:extra.text,replyDate:now}):q;});addH('Applicant response submitted');}
    return r;
  });
  if(msg) showToast(msg);
  S.selectedApp = null;
  render();
}

    '<div><div class="sb-uname">'+r.name+'</div><div class="sb-urole">'+r.sub+'</div></div></div>'+

    navItems.map(function(n){
      return '<div class="sb-item'+(S.nav===n.id?' active':'')+'" onclick="S.nav=\''+n.id+'\';S.selectedApp=null;render()">'+
        '<span class="sb-item-icon">'+n.icon+'</span>'+n.label+
        (n.id==='applications'&&openQ>0?'<span class="sb-badge">'+openQ+'</span>':'')+
      '</div>';
    }).join('')+'</div>'+
    '<div class="sb-footer"><div class="sb-switch" onclick="S.screen=\'landing\';S.role=null;S.selectedApp=null;render()">⇦ Switch Role</div></div></div>';

  var topbar = '<div class="topbar">'+
    '<div class="tb-title" style="flex:1"><p>'+r.label+'</p><p>'+r.sub+'</p></div>'+
    '<div class="tb-search"><span style="color:#9AA5B1;font-size:14px">⌕</span><input placeholder="Search applications..." oninput="S.search=this.value;render()" value="'+S.search+'"></div>'+
    '<div class="notif">'+(openQ>0?'🔔':'🔔')+(openQ>0?'<div class="notif-dot">'+openQ+'</div>':'')+' </div>'+
    '<div class="role-pill">'+(S.role==='applicant'?'Applicant':S.role==='reviewer'?'Reviewer':'Authority')+'</div></div>';

  var content = '';
  if(S.nav==='dashboard') content = renderDashboard(apps, accent, openQ);
  else if(S.nav==='applications') content = '<div class="section-title">All Applications</div>'+apps.map(function(a){return renderAppCard(a,accent);}).join('');
  else if(S.nav==='process') content = renderProcessFlow();
  else if(S.nav==='new-app') content = renderNewApp(accent);

  var panel = S.selectedApp ? renderPanel(accent) : '';

  return '<div class="portal">'+sidebar+
    '<div class="main-area">'+topbar+
    '<div class="content-wrap">'+
    '<div class="content" style="'+(S.selectedApp?'padding-right:460px':'')+'">'+content+'</div>'+
    panel+
    (S.modal?renderModal(accent):'')+'</div></div></div>';
}

function renderDashboard(apps, accent, openQ) {
  if(S.role==='applicant') {
    var tot=apps.length, inProg=apps.filter(function(a){return ['Allotment Ordered','Rejected'].indexOf(a.status)===-1;}).length;
    var granted=apps.filter(function(a){return a.status==='Allotment Ordered';}).length;
    return '<div style="margin-bottom:18px"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Welcome back, Ramesh 👋</div>'+
      '<div style="font-size:13px;color:#4A5568">Track your land allotment applications through every approval stage.</div></div>'+
      '<div class="stat-grid">'+
      [['📄',tot,'Total Applications','',accent],['⏱️',inProg,'In Progress','',accent],['⚠️',openQ,'Queries Pending',openQ>0?'Action required':'','#B45309'],['✅',granted,'Allotments Granted','','#0D9488']].map(function(sc){
        return '<div class="stat-card"><div class="stat-icon" style="background:'+sc[4]+'18;font-size:18px">'+sc[0]+'</div>'+
          '<div><div class="stat-val">'+sc[1]+'</div><div class="stat-lbl">'+sc[2]+'</div>'+(sc[3]?'<div class="stat-sub" style="color:'+sc[4]+'">'+sc[3]+'</div>':'')+' </div></div>';
      }).join('')+'</div>'+
      (openQ>0?'<div class="warning-box" style="margin-bottom:16px;display:flex;align-items:flex-start;gap:12px"><span style="font-size:18px">⚠️</span><div><strong>Action required</strong> — '+openQ+' '+(openQ===1?'query':'queries')+' awaiting your response before review can continue.</div></div>':'')+
      '<div class="section-title">My Applications</div>'+apps.map(function(a){return renderAppCard(a,accent);}).join('');
  }
  if(S.role==='reviewer') {
    var queue=apps.filter(function(a){return ['Application Submitted','L1 Review','Query — Applicant','L1 Approved','L2 Review','L2 Approved','MD Review'].indexOf(a.status)>-1;});
    var fwd=apps.filter(function(a){return ['Review Approved','With Authority','Authority Review','Authority Query','Allotment Ordered'].indexOf(a.status)>-1;});
    var allOpenQ=S.apps.reduce(function(n,a){return n+a.queries.filter(function(q){return !q.resolved;}).length;},0);
    return '<div style="margin-bottom:18px"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Review Queue</div>'+
      '<div style="font-size:13px;color:#4A5568">Applications awaiting L1 / L2 / MD review and sign-off.</div></div>'+
      '<div class="stat-grid">'+
      [['📥',queue.length,'Pending Action',queue.length>0?'Requires review':'',accent],['💬',allOpenQ,'Open Queries','','#B45309'],['→',fwd.length,'With Authority','','#5B21B6'],['✓',apps.length,'Total Managed','','#0D9488']].map(function(sc){
        return '<div class="stat-card"><div class="stat-icon" style="background:'+sc[4]+'18;font-size:18px">'+sc[0]+'</div>'+
          '<div><div class="stat-val">'+sc[1]+'</div><div class="stat-lbl">'+sc[2]+'</div>'+(sc[3]?'<div class="stat-sub" style="color:'+sc[4]+'">'+sc[3]+'</div>':'')+' </div></div>';
      }).join('')+'</div>'+
      '<div class="section-title"><div class="section-dot" style="background:#EF4444"></div>Pending Review ('+queue.length+')</div>'+
      queue.map(function(a){return renderAppCard(a,accent);}).join('')+
      (queue.length===0?'<div class="empty-state">✅ No applications pending review</div>':'')+
      (fwd.length>0?'<div class="section-title" style="margin-top:18px"><div class="section-dot" style="background:#22C55E"></div>Forwarded to Authority ('+fwd.length+')</div>'+fwd.map(function(a){return renderAppCard(a,accent);}).join(''):'');
  }
  // authority
  var rec=apps.filter(function(a){return ['With Authority','Authority Review','Authority Query','Allotment Ordered','Rejected'].indexOf(a.status)>-1;});
  var pend=rec.filter(function(a){return ['With Authority','Authority Review','Authority Query'].indexOf(a.status)>-1;});
  var dec=rec.filter(function(a){return ['Allotment Ordered','Rejected'].indexOf(a.status)>-1;});
  var authQ=S.apps.reduce(function(n,a){return n+a.queries.filter(function(q){return q.from==='Authority';}).length;},0);
  return '<div style="margin-bottom:18px"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Milecity Authority Review</div>'+
    '<div style="font-size:13px;color:#4A5568">Applications forwarded by the Review Team for regulatory decision.</div></div>'+
    '<div class="stat-grid">'+
    [['📥',rec.length,'Received','',accent],['🔍',pend.length,'Pending Review',pend.length>0?'Awaiting decision':'',accent],['❓',authQ,'Queries Raised','','#B45309'],['✅',dec.filter(function(a){return a.status==='Allotment Ordered';}).length,'Orders Issued','','#0D9488']].map(function(sc){
      return '<div class="stat-card"><div class="stat-icon" style="background:'+sc[4]+'18;font-size:18px">'+sc[0]+'</div>'+
        '<div><div class="stat-val">'+sc[1]+'</div><div class="stat-lbl">'+sc[2]+'</div>'+(sc[3]?'<div class="stat-sub" style="color:'+sc[4]+'">'+sc[3]+'</div>':'')+' </div></div>';
    }).join('')+'</div>'+
    '<div class="section-title"><div class="section-dot" style="background:'+accent+'"></div>Pending Decision ('+pend.length+')</div>'+
    pend.map(function(a){return renderAppCard(a,accent);}).join('')+
    (pend.length===0?'<div class="empty-state">No applications pending authority review</div>':'')+
    (dec.length>0?'<div class="section-title" style="margin-top:18px"><div class="section-dot" style="background:#22C55E"></div>Decisions Issued ('+dec.length+')</div>'+dec.map(function(a){return renderAppCard(a,accent);}).join(''):'');
}

function renderAppCard(app, accent) {
  var si = STAGE_MAP[app.status] || 0;
  var oq = app.queries.filter(function(q){return !q.resolved;}).length;
  return '<div class="app-card'+(S.selectedApp===app.id?' selected':'')+'" onclick="selectApp(\''+app.id+'\')" >'+
    '<div class="app-meta"><span class="app-id">'+app.id+' · '+app.type+'</span>'+priBadge(app.priority)+'</div>'+
    '<div class="app-name">'+app.entity+'</div>'+
    '<div class="app-prod">'+app.product+' · '+app.land+' acres · '+app.zone+' · '+app.plotNo+'</div>'+
    '<div class="app-footer">'+stBadge(app.status)+'<span class="app-date">'+app.date+'</span></div>'+
    (oq>0?'<div class="open-q-badge">⚠ '+oq+' open '+(oq===1?'query':'queries')+'</div>':'')+
    '<div class="prog-bar">'+progBar(app.status,accent)+'</div></div>';
}

function renderPanel(accent) {
  var app = null;
  S.apps.forEach(function(a){ if(a.id===S.selectedApp) app=a; });
  if(!app) return '';
  var si = STAGE_MAP[app.status] || 0;
  var openQ = app.queries.filter(function(q){return !q.resolved;});
  var canReply = S.role==='applicant' && openQ.some(function(q){return q.to==='Applicant';});
  var canReviewer = S.role==='reviewer' && ['Application Submitted','L1 Review','L1 Approved','L2 Review','L2 Approved','MD Review'].indexOf(app.status)>-1;
  var canForward = S.role==='reviewer' && app.status==='Review Approved';
  var canAuth = S.role==='authority' && ['With Authority','Authority Review','Authority Query'].indexOf(app.status)>-1;

  var tabContent = '';
  if(S.panelTab==='overview') {
    tabContent = '<div class="info-block" style="background:#EFF6FF;border-color:#BFDBFE">'+
      '<div class="ib-title" style="color:#1E40AF">📍 Plot details</div>'+
      '<div class="ib-grid">'+
      [['Plot no.',app.plotNo],['Survey nos.',app.surveyNos],['Village',app.village],['District',app.district],['Land req.',app.land+' acres'],['Zone',app.zone]].map(function(kv){
        return '<div><div class="ib-key" style="color:#1E40AF">'+kv[0]+'</div><div class="ib-val">'+kv[1]+'</div></div>';
      }).join('')+'</div></div>'+
      '<div class="info-block" style="background:#F0FDF4;border-color:#6EE7B7">'+
      '<div class="ib-title" style="color:#065F46">💰 Payment — 25% EMD basis</div>'+
      '<div class="ib-grid">'+
      [['Total premium',fmtCr(app.premium)],['25% EMD (on allotment)',fmtCr(app.premium*0.25)],['Balance 75%',fmtCr(app.premium*0.75)],['Balance due','Before lease execution']].map(function(kv){
        return '<div><div class="ib-key" style="color:#065F46">'+kv[0]+'</div><div class="ib-val">'+kv[1]+'</div></div>';
      }).join('')+'</div>'+
      '<div style="margin-top:10px;background:#fff;border-radius:7px;padding:7px 10px;border:1px solid #6EE7B7;font-size:11px;color:#065F46">Balance 75% payable before execution of lease agreement.</div></div>'+
      [['Entity type',app.type],['GST no.',app.gst],['Udyam/MSME',app.udyam||'Not registered'],['Water req.',app.water+' KLD/day'],['Power req.',app.power+' KVA'],['Date submitted',app.date]].map(function(kv){
        return '<div class="detail-row"><span class="detail-key">'+kv[0]+'</span><span class="detail-val">'+kv[1]+'</span></div>';
      }).join('');
  } else if(S.panelTab==='effluent') {
    var maxes = {cod:1500,bod:600,tds:7000,tss:600};
    tabContent = '<div class="warning-box">⚡ CETP tariff tier and utility treatment charges are determined from these declared effluent parameters.</div>'+
      [['COD','Chemical Oxygen Demand','cod','mg/L'],['BOD','Biological Oxygen Demand','bod','mg/L'],['TDS','Total Dissolved Solids','tds','mg/L'],['TSS','Total Suspended Solids','tss','mg/L']].map(function(row){
        var v=app.ef[row[2]], pct=Math.min((v/maxes[row[2]])*100,100);
        var bc=pct>70?'#BE123C':pct>40?'#B45309':'#0D9488';
        return '<div class="ef-card">'+
          '<div class="ef-top">'+
          '<div><span class="ef-name">'+row[0]+'</span><span class="ef-full">'+row[1]+'</span></div>'+
          '<div><span class="ef-val">'+v+'</span><span class="ef-unit">'+row[3]+'</span></div></div>'+
          '<div class="ef-bar-bg"><div class="ef-bar-fill" style="width:'+pct.toFixed(0)+'%;background:'+bc+'"></div></div>'+
          '<div class="ef-bottom"><span>0</span><span class="ef-level" style="color:'+bc+'">'+(pct>70?'High load':pct>40?'Moderate':'Low')+'</span><span>Max '+maxes[row[2]]+'</span></div></div>';
      }).join('')+
      '<div class="ef-card"><div class="ef-top"><span class="ef-name">pH</span><span class="ef-val">'+app.ef.ph+'</span></div><div style="font-size:11px;color:#4A5568;margin-top:2px">Acceptable range: 6.0 – 9.0 (CETP norms)</div></div>';
  } else if(S.panelTab==='queries') {
    tabContent = (app.queries.length===0?'<div class="empty-state">No queries on this application.</div>':'')+
      app.queries.map(function(q){
        return '<div class="q-card" style="border-color:'+(q.resolved?'#6EE7B7':'#FCD34D')+';background:'+(q.resolved?'#F0FDF4':'#FFFBEB')+'">'+
          '<div style="display:flex;justify-content:space-between">'+
          '<span class="q-from" style="color:'+(q.resolved?'#065F46':'#92400E')+'">'+q.from+' → '+q.to+'</span>'+
          '<span class="q-time">'+q.raised+'</span></div>'+
          '<div class="q-text">'+q.text+'</div>'+
          (q.resolved?'<div class="q-response" style="border-color:#6EE7B7">'+
            '<div class="q-resp-label" style="color:#065F46">Response · '+q.replyDate+'</div>'+
            '<div class="q-resp-text">'+q.reply+'</div></div>':
            '<div class="q-pending" style="background:#FEF3C7;color:#92400E">⏳ Awaiting response</div>')+
        '</div>';
      }).join('')+
      (canReply?'<div class="reply-box"><div class="reply-label">Reply to open query</div>'+
        '<textarea placeholder="Type your detailed response here..." oninput="S.replyText=this.value">'+S.replyText+'</textarea>'+
        '<button class="btn-primary" style="margin-top:8px" onclick="submitReply()">📤 Submit Response</button></div>':'');
  } else {
    tabContent = '<div class="timeline"><div class="tl-line"></div>'+
      app.history.map(function(h,i){
        var last = i===app.history.length-1;
        return '<div class="tl-item">'+
          '<div class="tl-dot" style="background:'+(last?'#EFF6FF':'#F1F5F9')+';border-color:'+(last?'#3B82F6':'#E2E8F0')+'"></div>'+
          '<div class="tl-step">'+h.s+'</div>'+
          '<div class="tl-by">'+h.by+' · '+h.at+'</div></div>';
      }).join('')+'</div>';
  }

  // Build action buttons
  var actBtns = '';
  if(canReviewer) {
    var acts = [];
    if(app.status==='Application Submitted') acts.push(['Begin L1 Review','#0E7490','#ECFEFF','begin-l1','']);
    if(app.status==='L1 Review') { acts.push(['Approve at L1','#065F46','#ECFDF5','approve-l1','modal']); acts.push(['Raise Query to Applicant','#B45309','#FFFBEB','query-l1','modal']); }
    if(app.status==='L1 Approved') acts.push(['Begin L2 Review','#6D28D9','#F5F3FF','begin-l2','']);
    if(app.status==='L2 Review') { acts.push(['Approve at L2','#065F46','#ECFDF5','approve-l2','modal']); acts.push(['Raise Query to Applicant','#B45309','#FFFBEB','query-l2','modal']); }
    if(app.status==='L2 Approved') acts.push(['Send for MD Approval','#1E40AF','#EFF6FF','begin-md','']);
    if(app.status==='MD Review') { acts.push(['MD Final Approval','#065F46','#ECFDF5','approve-md','modal']); acts.push(['Return for Revision','#BE123C','#FFF1F2','return','']); }
    actBtns = acts.map(function(a){ return buildActBtn(a,app.id); }).join('');
  }
  if(canForward) actBtns = buildActBtn(['Package & Forward to Milecity Authority','#5B21B6','#EDE9FE','forward-auth',''],app.id);
  if(canAuth) {
    var acts = [];
    if(app.status==='With Authority') acts.push(['Begin Authority Review','#C2410C','#FFF7ED','begin-auth','']);
    if(app.status==='Authority Review') {
      acts.push(['Issue Allotment Order (25% EMD)','#065F46','#ECFDF5','auth-approve','modal']);
      acts.push(['Raise Query to Review Team','#B45309','#FFFBEB','auth-query','modal']);
      acts.push(['Reject Application','#BE123C','#FFF1F2','auth-reject','modal']);
    }
    if(app.status==='Authority Query') acts.push(['Query Resolved — Resume Review','#065F46','#ECFDF5','auth-query-resolved','']);
    actBtns = acts.map(function(a){ return buildActBtn(a,app.id); }).join('');
  }

  return '<div class="slide-panel">'+
    '<div class="panel-hdr">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
    '<div style="flex:1;padding-right:10px">'+
    '<div class="panel-id">'+app.id+' · '+app.type+'</div>'+
    '<div class="panel-name">'+app.entity+'</div>'+
    '<div class="panel-sub">'+app.product+' · '+app.plotNo+'</div></div>'+
    '<button class="panel-close" onclick="S.selectedApp=null;render()">✕</button></div></div>'+
    '<div class="panel-status">'+
    '<div class="panel-badges">'+stBadge(app.status)+priBadge(app.priority)+
    (openQ.length>0?'<span class="s-badge" style="color:#B45309;background:#FFFBEB">⚠ '+openQ.length+' open</span>':'')+' </div>'+
    '<div class="prog-mini">'+Array(13).fill(0).map(function(_,i){return'<div class="prog-mini-seg" style="background:'+(i<=si?accent:'#E2E8F0')+'"></div>';}).join('')+'</div></div>'+
    '<div class="panel-tabs">'+
    ['overview','effluent','queries','history'].map(function(t){
      return '<button class="panel-tab'+(S.panelTab===t?' active':'')+'" onclick="S.panelTab=\''+t+'\';render()">'+
        (t==='overview'?'Overview':t==='effluent'?'Effluent':t==='queries'?'Queries ('+app.queries.length+')':'History')+'</button>';
    }).join('')+'</div>'+
    '<div class="panel-body">'+tabContent+'</div>'+
    (actBtns?'<div class="panel-actions"><div class="actions-label">AVAILABLE ACTIONS</div>'+actBtns+'</div>':'')+
  '</div>';
}

function buildActBtn(act, appId) {
  var isModal = act[3]==='modal' || act[4]==='modal';
  var onclick = isModal ? 'S.modal={type:\''+act[2]+'\',appId:\''+appId+'\'};S.modalText=\'\';render()' : 'doAction(\''+act[2]+'\',\''+appId+'\',\'\')';
  return '<button class="act-btn" style="color:'+act[0]+';border-color:'+act[0]+';background:'+act[1]+'" onclick="'+onclick+'">'+act[0]+'</button>';
}

function renderModal(accent) {
  var t = S.modal.type;
  var cfg = {
    'approve-l1':{title:'Confirm L1 Approval',req:false},
    'query-l1':{title:'Raise Query to Applicant',sub:'L1 Review → Applicant',req:true},
    'approve-l2':{title:'Confirm L2 Approval',req:false},
    'query-l2':{title:'Raise Query to Applicant',sub:'L2 Review → Applicant',req:true},
    'approve-md':{title:'MD Final Approval',req:false},
    'auth-approve':{title:'Issue Allotment Order',sub:'25% EMD applicable on receipt',req:false,emd:true},
    'auth-query':{title:'Raise Query to Review Team',sub:'Authority → Review Team',req:true},
    'auth-reject':{title:'Reject Application',sub:'Authority final decision',req:true,danger:true}
  }[t] || {title:'Confirm',req:false};
  return '<div class="modal-overlay" onclick="if(event.target===this){S.modal=null;render()}">'+
    '<div class="modal-box">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:16px">'+
    '<div><div class="modal-title">'+cfg.title+'</div>'+(cfg.sub?'<div class="modal-sub">'+cfg.sub+'</div>':'')+' </div>'+
    '<button onclick="S.modal=null;render()" style="background:none;border:none;font-size:20px;color:#9AA5B1;cursor:pointer">✕</button></div>'+
    (cfg.emd?'<div class="success-box"><strong>25% EMD required:</strong> The applicant pays 25% of total plot premium on receipt of this allotment order. Balance 75% is payable before execution of the lease agreement.</div>':'')+
    '<textarea id="modalText" placeholder="'+(cfg.req?'Required — describe clearly...':'Notes (optional)...')+'" oninput="S.modalText=this.value">'+S.modalText+'</textarea>'+
    (cfg.req&&!S.modalText.trim()?'<div style="font-size:11px;color:var(--red);margin:6px 0">This field is required.</div>':'')+
    '<div class="modal-btns">'+
    '<button class="btn-ghost" onclick="S.modal=null;render()">Cancel</button>'+
    '<button class="'+(cfg.danger?'btn-danger':'btn-primary')+'" '+(cfg.req&&!S.modalText.trim()?'disabled':'')+' onclick="confirmModal()">Confirm</button>'+
    '</div></div></div>';
}

function renderProcessFlow() {
  var phases = [
    {code:'A',name:'Registration',color:'#1B4FCC',bg:'#EFF6FF',steps:['A1 — Mobile OTP verification','A1 — Entity name, type, GST, status','A2/A3 — Udyam/MSME upload if applicable','A3 — Address, KMP, contact details','A4 — Business Plan & DPR upload']},
    {code:'B1',name:'Application & Land Identification',color:'#0B7B6B',bg:'#F0FDFA',steps:['Proposed products & manufacturing activity','Land, water, power requirements','Effluent details (COD, BOD, TDS, TSS, pH)','Zone & plot selection from master plan','Survey nos., village, district']},
    {code:'B2',name:'Internal Review (Milecity Team)',color:'#5B21B6',bg:'#F5F3FF',steps:['L1 field team review','Query management with applicant','L2 senior technical review','MD authority sign-off','Package & forward to Milecity Authority']},
    {code:'B3',name:'Land Allotment Committee',color:'#A05C00',bg:'#FFFBEB',note:'If required',steps:['Applicable for larger land parcels','Board-level approval for 5–20 acre plots','Committee review & recommendation']},
    {code:'B4',name:'Allotment Letter & Advance Payment',color:'#166534',bg:'#F0FDF4',note:'25% EMD',steps:['Milecity Authority issues allotment letter','Applicant pays 25% EMD of total premium','Balance 75% payable before lease execution']},
    {code:'B6',name:'Lease Agreement Execution',color:'#135B35',bg:'#ECFDF5',note:'75% balance',steps:['Balance 75% premium payment confirmed','Lease agreement signed by both parties','Plot possession formally handed over']}
  ];
  return '<div style="margin-bottom:18px"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Application Process Flow</div>'+
    '<div style="font-size:13px;color:#4A5568">End-to-end journey from entity registration to lease agreement execution.</div></div>'+
    '<div class="phase-flow">'+
    phases.map(function(ph,i){
      return '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0">'+
        '<div class="phase-pill">'+
        '<div class="phase-code" style="background:'+ph.color+'">'+ph.code+'</div>'+
        '<div class="phase-pill-name">'+ph.name+'</div>'+
        (ph.note?'<div class="phase-note" style="background:'+ph.color+'">'+ph.note+'</div>':'')+' </div>'+
        (i<phases.length-1?'<div class="phase-arrow">›</div>':'')+' </div>';
    }).join('')+'</div>'+
    '<div class="phase-cards">'+
    phases.map(function(ph){
      return '<div class="phase-card">'+
        '<div class="phase-card-hdr" style="background:'+ph.bg+';border-left-color:'+ph.color+'">'+
        '<div class="phase-card-code" style="background:'+ph.color+'">'+ph.code+'</div>'+
        '<div class="phase-card-name">'+ph.name+'</div>'+
        (ph.note?'<div class="phase-card-note" style="background:'+ph.color+'">'+ph.note+'</div>':'')+' </div>'+
        '<div class="phase-card-body">'+
        ph.steps.map(function(s){return '<div class="phase-step"><div class="phase-step-dot" style="background:'+ph.color+'"></div>'+s+'</div>';}).join('')+
        '</div></div>';
    }).join('')+'</div>'+
    '<div class="emd-box" style="margin-top:16px">'+
    '<div class="emd-title">💰 Payment Structure</div>'+
    '<div class="emd-grid">'+
    [['On allotment order','25% EMD','Earnest Money Deposit — secures the plot'],
     ['Before lease signing','75% balance','Full premium settled to execute lease'],
     ['Post lease execution','Possession','Plot handed over for construction']].map(function(row){
      return '<div class="emd-card"><div class="emd-when">'+row[0]+'</div><div class="emd-amt">'+row[1]+'</div><div class="emd-desc">'+row[2]+'</div></div>';
    }).join('')+'</div></div>';
}

function renderNewApp(accent) {
  var filtered = S.zoneFilter==='All' ? PLOTS : PLOTS.filter(function(p){ return p.zone===S.zoneFilter||(S.zoneFilter==='Food'&&p.zone==='Food'); });
  return '<div style="margin-bottom:18px"><div style="font-size:20px;font-weight:800;margin-bottom:4px">New Land Allotment Application</div>'+
    '<div style="font-size:13px;color:#4A5568">Complete all sections to submit your application for review.</div></div>'+
    '<div class="new-app-tabs">'+
    [{n:1,l:'Product & Requirements'},{n:2,l:'Plot Selection'},{n:3,l:'Review & Submit'}].map(function(s){
      return '<button class="new-app-tab'+(S.newStep===s.n?' active':S.newStep>s.n?' done':'')+'" onclick="S.newStep='+s.n+';render()">'+
        '<div class="step-num" style="background:'+(S.newStep>s.n?'#D1FAE5':S.newStep===s.n?accent:'#F1F5F9')+';color:'+(S.newStep>s.n?'#065F46':S.newStep===s.n?'#fff':'#9AA5B1')+'">'+(S.newStep>s.n?'✓':s.n)+'</div>'+s.l+'</button>';
    }).join('')+'</div>'+
    (S.newStep===1?'<div class="card">'+
      '<div class="field"><label class="label">Proposed product(s) to manufacture *</label><input placeholder="e.g. HDPE Pipes, Structural Steel, Specialty Chemicals"></div>'+
      '<div class="field"><label class="label">Industrial zone *</label><select><option>Industrial</option><option>Chemical</option><option>Auto Ancillary</option><option>Food Processing</option><option>Pharma</option></select></div>'+
      '<div class="grid3"><div class="field"><label class="label">Land required * (acres)</label><input type="number" placeholder="4.5"></div>'+
      '<div class="field"><label class="label">Water required * (KLD)</label><input type="number" placeholder="150"></div>'+
      '<div class="field"><label class="label">Power required * (KVA)</label><input type="number" placeholder="800"></div></div>'+
      '<div class="divider"><div style="font-size:13px;font-weight:700;margin-bottom:4px">Effluent Characteristics</div>'+
      '<div style="font-size:12px;color:#4A5568;margin-bottom:12px">CETP tariff tier is determined from these declared values.</div>'+
      '<div class="grid5">'+['COD (mg/L)','BOD (mg/L)','TDS (mg/L)','TSS (mg/L)','pH range'].map(function(l){return'<div class="field"><label class="label">'+l+'</label><input placeholder="—" style="text-align:center"></div>';}).join('')+
      '</div></div></div>':'')+
    (S.newStep===2?'<div class="card">'+
      '<div style="font-size:14px;font-weight:700;margin-bottom:12px">Select Plot from MIDC Master Plan</div>'+
      '<div class="filter-btns">'+['All','Industrial','Chemical','Auto Ancillary','Food Processing'].map(function(z){return'<button class="filter-btn'+(S.zoneFilter===z?' active':'')+'" onclick="S.zoneFilter=\''+z+'\';render()">'+z+'</button>';}).join('')+'</div>'+
      '<div style="display:flex;gap:14px;margin-bottom:12px">'+[{s:'Available',c:'#0D9488'},{s:'Under Review',c:'#B45309'},{s:'Allotted',c:'#9AA5B1'}].map(function(x){return'<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#4A5568"><div style="width:10px;height:10px;border-radius:2px;background:'+x.c+'"></div>'+x.s+'</div>';}).join('')+'</div>'+
      '<div class="plot-grid">'+filtered.map(function(p){
        var cls='plot-tile '+( p.status==='Available'?'available':p.status==='Allotted'?'allotted':'under-review')+(S.selectedPlot===p.id?' selected':'');
        var sc=p.status==='Available'?'#0D9488':p.status==='Allotted'?'#9AA5B1':'#B45309';
        return '<div class="'+cls+'"'+(p.status==='Available'?' onclick="S.selectedPlot=\''+p.id+'\';render()"':'')+'>'+
          '<div class="plot-id">'+p.id+'</div>'+
          '<div class="plot-area">'+p.area+' acres</div>'+
          '<div class="plot-status" style="color:'+sc+'">'+p.status+'</div></div>';
      }).join('')+'</div>'+
      (S.selectedPlot?'<div class="info-box" style="margin-top:12px">📍 Selected: <strong>'+S.selectedPlot+'</strong></div>':'')+
    '</div>':'')+
    (S.newStep===3?'<div class="card">'+
      '<div class="info-box">📋 Review your application details before final submission.</div>'+
      '<div class="grid4" style="margin-bottom:16px">'+
      [['Entity','Shah Polymers Pvt Ltd'],['Zone','Industrial'],['Plot selected',S.selectedPlot||'Not selected'],['Land req.','4.5 acres'],['Water req.','150 KLD/day'],['Power req.','800 KVA'],['COD / BOD','450 / 150 mg/L'],['pH Range','7.0–8.5']].map(function(kv){
        return '<div style="background:#F8FAFC;border:1px solid var(--border);border-radius:7px;padding:10px 12px">'+
          '<div style="font-size:10px;font-weight:600;color:#9AA5B1;margin-bottom:2px">'+kv[0]+'</div>'+
          '<div style="font-size:12px;font-weight:700">'+kv[1]+'</div></div>';
      }).join('')+'</div>'+
      '<div class="warning-box">⚠️ By submitting you confirm the accuracy of all information. Misrepresentation may result in allotment cancellation.</div>'+
      '<button class="btn-success" style="width:100%;justify-content:center;margin-top:12px;padding:11px" onclick="S.nav=\'dashboard\';showToast(\'Application submitted successfully!\');render()">📤 Submit Application</button></div>':'')+
    '<div style="display:flex;justify-content:space-between;margin-top:16px">'+
    '<button class="btn-ghost" '+(S.newStep===1?'disabled':'')+' onclick="S.newStep=Math.max(1,S.newStep-1);render()">← Back</button>'+
    (S.newStep<3?'<button class="btn-primary" onclick="S.newStep++;render()">Continue →</button>':'')+
    '</div>';
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function selectRole(role) { S.role=role; S.screen='portal'; S.nav='dashboard'; S.selectedApp=null; render(); }
function selectApp(id) { S.selectedApp=id; S.panelTab='overview'; S.replyText=''; render(); }
function confirmModal() {
  if(!S.modal) return;
  var t=S.modal.type, id=S.modal.appId, txt=S.modalText;
  S.modal=null;
  doAction(t, id, txt);
}
function submitReply() {
  if(!S.replyText.trim()) return;
  var app=null; S.apps.forEach(function(a){if(a.id===S.selectedApp)app=a;});
  if(!app) return;
  var openQ=app.queries.find(function(q){return !q.resolved&&q.to==='Applicant';});
  if(!openQ) return;
  doAction('reply', S.selectedApp, {qid:openQ.id, text:S.replyText});
  S.replyText='';
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  var el = document.getElementById('app');
  if(S.screen==='landing') el.innerHTML = renderLanding();
  else if(S.screen==='register') el.innerHTML = renderRegister();
  else el.innerHTML = renderPortal();
}
render();
</script>
